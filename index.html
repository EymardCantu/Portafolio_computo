<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portafolio de Cómputo</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@^3/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 text-gray-900">
    <div class="container mx-auto p-8">
        <h1 class="text-4xl font-bold mb-8">Portafolio de Cómputo - Visualización de Datos</h1>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
            <div>
                <img src="bubble_chart_year_popularity.png" alt="Bubble Chart - Popularidad por Año">
                <p class="mt-2 text-center font-semibold">Bubble Chart - Popularidad por Año</p>
            </div>
            <div>
                <img src="scatter_duration_popularity.png" alt="Scatter Plot - Duración vs Popularidad">
                <p class="mt-2 text-center font-semibold">Scatter Plot - Duración vs Popularidad</p>
            </div>
            <div>
                <img src="top_artists_popularity.png" alt="Top Artistas por Popularidad">
                <p class="mt-2 text-center font-semibold">Top Artistas por Popularidad</p>
            </div>
        </div>
    </div>
</body>
</html>
