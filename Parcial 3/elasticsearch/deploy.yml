name: Deploy Graph to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repo
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v3
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: pip install pandas matplotlib elasticsearch

    - name: Generate Graph
      run: python plot.py

    - name: Ensure docs directory exists and copy files
      run: |
        mkdir -p docs
        touch docs/.nojekyll
        cp *.png docs/ 2>/dev/null || true
        cp *.jpg docs/ 2>/dev/null || true
        cp *.jpeg docs/ 2>/dev/null || true
        cp *.svg docs/ 2>/dev/null || true
        echo "<html><head><title>Gráfico generado</title></head><body>" > docs/index.html
        echo "<h1>Gráfico generado</h1>" >> docs/index.html
        for img in docs/*.png docs/*.jpg docs/*.jpeg docs/*.svg; do
          if [ -f "$img" ]; then
            filename=$(basename "$img")
            echo "<img src=\"$filename\" alt=\"Gráfico generado\" style=\"max-width:100%;\"><br>" >> docs/index.html
            break
          fi
        done
        echo "</body></html>" >> docs/index.html

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./docs